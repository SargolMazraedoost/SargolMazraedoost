<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 484" role="img" aria-labelledby="title desc">
  <title id="title">Molecular AI research workflow terminal</title>
  <desc id="desc">A slate, pink, and blue terminal dashboard showing a molecular AI workflow and molecular interaction signal.</desc>

  <!-- header-gif palette: slate navy, dusty blue, blush pink, coral, pale gray -->
  <rect width="1000" height="484" rx="22" fill="#444b67"/>
  <rect x="16" y="16" width="968" height="452" rx="17" fill="#606383"/>
  <defs>
    <clipPath id="typing-line">
      <rect x="215" y="86" width="430" height="34">
        <animate attributeName="width" from="0" to="430" dur="1.5s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="968" height="58" rx="17" fill="#444b67"/>
  <rect x="16" y="55" width="968" height="19" fill="#444b67"/>
  <circle cx="49" cy="45" r="9" fill="#f3a09d"/>
  <circle cx="79" cy="45" r="9" fill="#eda6c2"/>
  <circle cx="109" cy="45" r="9" fill="#9ebcc3"/>
  <text x="500" y="51" text-anchor="middle" fill="#dbe3e6" font-family="monospace" font-size="18">molecular-ai / research-console</text>

  <text x="44" y="112" fill="#f3a09d" font-family="monospace" font-size="20">sargol@pknu</text>
  <text x="181" y="112" fill="#dbe3e6" font-family="monospace" font-size="20">:</text>
  <text x="195" y="112" fill="#9ebcc3" font-family="monospace" font-size="20">~</text>
  <text x="215" y="112" fill="#dbe3e6" font-family="monospace" font-size="20" clip-path="url(#typing-line)">$ molecular-ai --input molecule.smi</text>

  <g opacity="0">
  <text x="47" y="153" fill="#eda6c2" font-family="monospace" font-size="17">01</text>
  <text x="95" y="153" fill="#dbe3e6" font-family="monospace" font-size="17">encoding</text>
  <text x="250" y="153" fill="#9ebcc3" font-family="monospace" font-size="17">SMILES + DFT descriptors</text>
  <rect x="250" y="166" width="330" height="10" rx="5" fill="#444b67" stroke="#8fa5b6" stroke-opacity=".3"/>
  <rect x="250" y="166" width="275" height="10" rx="5" fill="#eda6c2"/>
    <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="1.7s" fill="freeze"/>
  </g>

  <g opacity="0">
  <text x="47" y="206" fill="#eda6c2" font-family="monospace" font-size="17">02</text>
  <text x="95" y="206" fill="#dbe3e6" font-family="monospace" font-size="17">learning</text>
  <text x="250" y="206" fill="#9ebcc3" font-family="monospace" font-size="17">machine learning / deep learning</text>
  <rect x="250" y="219" width="330" height="10" rx="5" fill="#444b67" stroke="#8fa5b6" stroke-opacity=".3"/>
  <rect x="250" y="219" width="330" height="10" rx="5" fill="#f3a09d">
    <animate attributeName="width" from="0" to="330" dur="1.8s" begin="2.8s" fill="freeze"/>
  </rect>
    <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="2.8s" fill="freeze"/>
  </g>

  <g opacity="0">
  <text x="47" y="259" fill="#eda6c2" font-family="monospace" font-size="17">03</text>
  <text x="95" y="259" fill="#dbe3e6" font-family="monospace" font-size="17">validating</text>
  <text x="250" y="259" fill="#9ebcc3" font-family="monospace" font-size="17">retention time + affinity</text>
  <rect x="250" y="272" width="330" height="10" rx="5" fill="#444b67" stroke="#8fa5b6" stroke-opacity=".3"/>
  <rect x="250" y="272" width="286" height="10" rx="5" fill="#9ebcc3"/>
    <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="4.9s" fill="freeze"/>
  </g>

  <g opacity="0">
  <text x="47" y="312" fill="#eda6c2" font-family="monospace" font-size="17">04</text>
  <text x="95" y="312" fill="#dbe3e6" font-family="monospace" font-size="17">explaining</text>
  <text x="250" y="312" fill="#9ebcc3" font-family="monospace" font-size="17">MD + ΔG + interactions</text>
  <rect x="250" y="325" width="330" height="10" rx="5" fill="#444b67" stroke="#8fa5b6" stroke-opacity=".3"/>
  <rect x="250" y="325" width="320" height="10" rx="5" fill="#f3a09d"/>
    <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="5.6s" fill="freeze"/>
  </g>

  <rect x="625" y="99" width="322" height="258" rx="13" fill="#444b67" opacity=".88"/>
  <text x="651" y="133" fill="#dbe3e6" font-family="monospace" font-size="16">MOLECULAR SIGNAL</text>
  <circle cx="781" cy="222" r="43" fill="#9ebcc3" opacity=".28"/>
  <circle cx="781" cy="222" r="24" fill="#f3a09d"/>
  <circle cx="714" cy="177" r="13" fill="#eda6c2"/>
  <circle cx="850" cy="177" r="13" fill="#eda6c2"/>
  <circle cx="714" cy="268" r="13" fill="#eda6c2"/>
  <circle cx="850" cy="268" r="13" fill="#eda6c2"/>
  <line x1="727" y1="185" x2="760" y2="209" stroke="#dbe3e6" stroke-width="7"/>
  <line x1="838" y1="185" x2="802" y2="209" stroke="#dbe3e6" stroke-width="7"/>
  <line x1="727" y1="260" x2="760" y2="235" stroke="#dbe3e6" stroke-width="7"/>
  <line x1="838" y1="260" x2="802" y2="235" stroke="#dbe3e6" stroke-width="7"/>
  <text x="651" y="329" fill="#9ebcc3" font-family="monospace" font-size="15">binding interface detected</text>

  <line x1="44" y1="371" x2="947" y2="371" stroke="#8fa5b6" stroke-width="2" opacity=".55"/>
  <text x="45" y="416" fill="#9ebcc3" font-family="monospace" font-size="19">✓ output</text>
  <text x="190" y="416" fill="#dbe3e6" font-family="monospace" font-size="19">interpretable molecular insight</text>
  <rect x="916" y="399" width="11" height="23" rx="2" fill="#eda6c2">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
